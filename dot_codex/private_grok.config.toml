model = "grok-4.5"
model_provider = "xai"
model_reasoning_effort = "high"
service_tier = "default"
web_search = "disabled"

[model_providers.xai]
name = "xAI"
base_url = "https://api.x.ai/v1"
wire_api = "responses"

[model_providers.xai.auth]
command = "/usr/bin/bw"
args = ["--nointeraction", "get", "password", "GROK_API_KEY"]
timeout_ms = 15000
refresh_interval_ms = 0

[features]
image_generation = false
