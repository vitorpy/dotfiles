---
# Sources: upstream installation docs linked in ../README.md.
fedora_repositories:
  - name: fedora-hyprland
    description: Hyprland desktop (lionheartp COPR)
    baseurl: https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-$releasever-$basearch/
    gpgkey: https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/pubkey.gpg
    packages: ['hypr*', 'aquamarine*', 'quickshell*', 'uwsm*', 'xdg-desktop-portal-hyprland*']
  - name: fedora-ghostty
    description: Ghostty (scottames COPR)
    baseurl: https://download.copr.fedorainfracloud.org/results/scottames/ghostty/fedora-$releasever-$basearch/
    gpgkey: https://download.copr.fedorainfracloud.org/results/scottames/ghostty/pubkey.gpg
    packages: ['ghostty*']
  - name: 1password
    description: 1Password stable
    baseurl: https://downloads.1password.com/linux/rpm/stable/$basearch
    gpgkey: https://downloads.1password.com/linux/keys/1password.asc
    repo_gpgcheck: true
    packages: ['1password', '1password-cli']
    corporate: true
  - name: roam
    description: Roam vendor RPMs
    baseurl: https://download.ro.am/Roam/8a86d88cfc9da3551063102e9a4e2a83/linux/redhat
    gpgkey: https://download.ro.am/public.key
    packages: ['roam']
    corporate: true
  - name: vscodium
    description: VSCodium upstream
    baseurl: https://repo.vscodium.dev/rpm
    gpgkey: https://repo.vscodium.dev/vscodium.gpg
    repo_gpgcheck: true
    packages: ['codium']
  - name: google-chrome
    description: Google Chrome stable
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/$basearch
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
    packages: ['google-chrome-stable']
  - name: tailscale-stable
    description: Tailscale stable
    baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
    gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    repo_gpgcheck: true
    packages: ['tailscale']
  - name: hashicorp
    description: HashiCorp stable
    baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    packages: ['terraform']
