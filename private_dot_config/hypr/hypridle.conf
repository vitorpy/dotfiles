general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; /home/vitorpy/.config/hypr/hypridle-brightness.sh restore-all  # restore lights even when lid wake does not resume idle listeners.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = /home/vitorpy/.config/hypr/hypridle-brightness.sh dim-display
    on-resume = /home/vitorpy/.config/hypr/hypridle-brightness.sh restore-display
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                               # 2.5min.
    on-timeout = /home/vitorpy/.config/hypr/hypridle-brightness.sh dim-keyboard
    on-resume = /home/vitorpy/.config/hypr/hypridle-brightness.sh restore-keyboard
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    ignore_inhibit = true                                             # allow DPMS after locking even when applications inhibit idle.
    condition_cmd = pidof hyprlock
    condition_retry = 5                                               # fail closed and retry while the session remains idle.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'      # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'       # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
