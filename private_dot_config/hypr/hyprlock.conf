# Hyprlock configuration — Berg style
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = Avenir Next M for BBG Medium
$card = rgba(0,0,0,0.65)
$outline = rgb(464646)
$on_surface = rgb(d7d7d7)
$on_surface_variant = rgb(d7d7d7)
$primary = rgb(f49f31)
$warning = rgb(FEE334)
$error = rgb(d54135)
$shadow = rgba(0,0,0,0.85)

general {
    hide_cursor = false
}

auth {
    fingerprint {
        enabled = false
        ready_message = Touch sensor to unlock
        present_message = Scanning…
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/vitorpy/.local/share/arts-wallpaper/current.webp
    blur_passes = 0
}

# Top-right clock and date card
shape {
    monitor =
    size = 520, 174
    color = $card
    rounding = 15
    border_size = 1
    border_color = $outline
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = -24, -24
    halign = right
    valign = top
    zindex = 0
}

# Bottom-left artwork details card
shape {
    monitor =
    size = 780, 94
    color = $card
    rounding = 15
    border_size = 1
    border_color = $outline
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 24, 24
    halign = left
    valign = bottom
    zindex = 0
}

# Keyboard layout chip below the password field
shape {
    monitor =
    size = 78, 42
    color = $card
    rounding = 12
    border_size = 1
    border_color = $outline
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 0, -106
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = $card

    outer_color = $primary   # active — Berg orange
    check_color = $primary   # waiting for authentication
    fail_color = $error      # authentication failure
    capslock_color = $warning

    font_color = $on_surface
    fade_on_empty = false
    rounding = 15
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    font_family = $font
    placeholder_text = Enter password…
    check_text = Authenticating…
    fail_text = Authentication failed ($ATTEMPTS)

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
    zindex = 1
}

# TIME (top-right)
label {
    monitor =
    text = $TIME
    font_size = 78
    font_family = $font
    color = $on_surface
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = -48, -28
    halign = right
    valign = top
    zindex = 1
}

# DATE (top-right, below time)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 24
    font_family = $font
    color = $on_surface_variant
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = -48, -124
    halign = right
    valign = top
    zindex = 1
}

# CURRENT ARTWORK (bottom-left)
label {
    monitor =
    text = cmd[update:60000] /home/vitorpy/.config/hypr/hyprlock-artwork.sh
    text_align = left
    font_size = 20
    font_family = $font
    color = $on_surface
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 48, 43
    halign = left
    valign = bottom
    zindex = 1
}

# Keyboard layout toggle (below password field)
label {
    monitor =
    text = $LAYOUT[EN,PL]
    font_size = 18
    font_family = $font
    color = $on_surface
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    onclick = hyprctl switchxkblayout all next

    position = 0, -106
    halign = center
    valign = center
    zindex = 1
}
