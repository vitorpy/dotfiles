---
# Personal workstations inherit the complete workstation profile and add tools
# that should not be installed on corporate machines.
arch_notion_cli_enabled: true
arch_google_earth_pro_desktop_override_enabled: true
arch_pacman_packages_personal:
  - qgis
  - qpdf

arch_aur_packages_personal:
  - claude-code
  - claude-desktop
  - antigravity-cli
  - google-earth-pro
  - grok-bot-bin
