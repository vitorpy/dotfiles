---
arch_hostname: mediaserver
arch_timezone: Europe/Warsaw
arch_memory_pressure_managed: true
arch_memory_pressure_enabled: false

arch_host_pacman_packages_extra:
  - 7zip
  - aardvark-dns
  - calibre
  - caddy
  - crun
  - netavark
  - podman
  - tailscale
  - uv
  - vpl-gpu-rt
  - zram-generator
arch_host_aur_packages_extra:
  - bazarr
  - flaresolverr
  - kcc
  - lidarr-bin
  - prowlarr
  - radarr
  - sonarr
arch_host_system_services_extra:
  - bazarr
  - flaresolverr
  - lidarr
  - prowlarr
  - radarr
  - sonarr
  - systemd-timesyncd # Keep OAuth client assertions within their clock-skew limit.
  - tailscaled
arch_host_firewall_allowed_tcp_ports_extra:
  - 7878
  - 8686
  - 8989
  - 9696
arch_host_firewall_allowed_udp_ports_extra:
  - 41641
arch_host_firewall_trusted_interfaces_extra:
  - tailscale0

arch_tailscale_accept_routes: true

arch_extra_mounts:
  - enabled: true
    src: "LABEL=MEDIA"
    path: /mnt/media
    fstype: ext4
    opts: defaults,nofail,x-systemd.device-timeout=10
    mode: "2775"

arch_transmission_download_dir: /mnt/media/downloads
arch_transmission_download_categories:
  - lidarr
  - radarr
  - tv-sonarr

arch_flaresolverr_enabled: true
