---
- name: Point /etc/localtime at the selected timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ arch_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  notify: Sync hardware clock

- name: Ensure locale is enabled in locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#?{{ arch_locale | regex_escape() }} "
    line: "{{ arch_locale }} {{ arch_locale.split('.')[-1] }}"
  notify: Regenerate locales

- name: Write locale.conf
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ arch_locale }}\n"
    mode: "0644"

- name: Write vconsole.conf
  ansible.builtin.copy:
    dest: /etc/vconsole.conf
    content: "KEYMAP={{ arch_console_keymap }}\n"
    mode: "0644"

- name: Write hostname
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ arch_hostname }}\n"
    mode: "0644"

- name: Render /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: "0644"
  when: arch_manage_hosts | bool

- name: Ensure primary user exists
  ansible.builtin.user:
    name: "{{ arch_primary_user }}"
    groups: wheel
    append: true
    shell: "{{ arch_primary_user_shell }}"
    create_home: true
  when: arch_manage_user | bool

- name: Ensure primary user SSH directory exists
  ansible.builtin.file:
    path: "{{ arch_primary_user_home }}/.ssh"
    state: directory
    owner: "{{ arch_primary_user }}"
    group: "{{ arch_primary_user }}"
    mode: "0700"
  when:
    - arch_manage_user | bool
    - arch_primary_user_authorized_keys | length > 0

- name: Install primary user authorized SSH keys
  ansible.builtin.lineinfile:
    path: "{{ arch_primary_user_home }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: true
    owner: "{{ arch_primary_user }}"
    group: "{{ arch_primary_user }}"
    mode: "0600"
  loop: "{{ arch_primary_user_authorized_keys }}"
  loop_control:
    label: "{{ item.split()[-1] }}"
  when:
    - arch_manage_user | bool
    - arch_primary_user_authorized_keys | length > 0

- name: Ensure sudoers drop-in directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: arch_manage_sudoers | bool

- name: Ensure sudo is installed before managing sudoers
  ansible.builtin.package:
    name: sudo
    state: present
  when: arch_manage_sudoers | bool

- name: Manage wheel sudoers drop-in
  ansible.builtin.template:
    src: sudoers-wheel.j2
    dest: /etc/sudoers.d/10-wheel
    mode: "0440"
    validate: /usr/bin/visudo -cf %s
  when: arch_manage_sudoers | bool

- name: Configure managed workstation memory pressure
  when: arch_memory_pressure_managed | bool
  tags:
    - memory
  block:
    - name: Manage zram generator policy
      ansible.builtin.template:
        src: zram-generator.conf.j2
        dest: /etc/systemd/zram-generator.conf
        owner: root
        group: root
        mode: "0644"

    - name: Ensure systemd-oomd configuration directory exists
      ansible.builtin.file:
        path: /etc/systemd/oomd.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure system user-unit override directory exists
      ansible.builtin.file:
        path: /etc/systemd/user/app.slice.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install systemd-oomd thresholds
      ansible.builtin.template:
        src: oomd-workstation.conf.j2
        dest: /etc/systemd/oomd.conf.d/50-workstation.conf
        owner: root
        group: root
        mode: "0644"
      when: arch_memory_pressure_enabled | bool
      notify: Restart systemd-oomd

    - name: Install the user application-slice oomd policy
      ansible.builtin.template:
        src: app-slice-oomd.conf.j2
        dest: /etc/systemd/user/app.slice.d/50-workstation-oomd.conf
        owner: root
        group: root
        mode: "0644"
      when: arch_memory_pressure_enabled | bool

    - name: Remove systemd-oomd thresholds when disabled
      ansible.builtin.file:
        path: /etc/systemd/oomd.conf.d/50-workstation.conf
        state: absent
      when: not (arch_memory_pressure_enabled | bool)

    - name: Remove the user application-slice oomd policy when disabled
      ansible.builtin.file:
        path: /etc/systemd/user/app.slice.d/50-workstation-oomd.conf
        state: absent
      when: not (arch_memory_pressure_enabled | bool)

    - name: Set systemd-oomd activation state
      ansible.builtin.systemd:
        name: systemd-oomd.service
        enabled: "{{ arch_memory_pressure_enabled | bool }}"
        state: >-
          {{ 'started' if arch_memory_pressure_enabled | bool else 'stopped' }}
        daemon_reload: true

- name: Configure managed workstation file descriptor limits
  when: arch_file_descriptor_limits_managed | bool
  tags:
    - limits
  block:
    - name: Ensure systemd manager drop-in directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/systemd/system.conf.d
        - /etc/systemd/user.conf.d

    - name: Install systemd manager file descriptor limits
      ansible.builtin.template:
        src: default-limit-nofile.conf.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/systemd/system.conf.d/50-workstation-nofile.conf
        - /etc/systemd/user.conf.d/50-workstation-nofile.conf
      when: arch_file_descriptor_limits_enabled | bool

    - name: Remove systemd manager file descriptor limits when disabled
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system.conf.d/50-workstation-nofile.conf
        - /etc/systemd/user.conf.d/50-workstation-nofile.conf
      when: not (arch_file_descriptor_limits_enabled | bool)
