---
- name: Compute effective pacman package list
  ansible.builtin.set_fact:
    packages_pacman_effective: "{{ (arch_pacman_packages + arch_host_pacman_packages_extra) | unique }}"
  tags:
    - packages

- name: Compute effective AUR package list
  ansible.builtin.set_fact:
    packages_aur_effective: "{{ (arch_aur_packages + arch_host_aur_packages_extra) | unique }}"
  tags:
    - packages

- name: Install pacman packages
  ansible.builtin.package:
    name: "{{ packages_pacman_effective }}"
    state: present
  when: packages_pacman_effective | length > 0
  tags:
    - packages

- name: Validate oauth2l platform
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["architecture"] == "x86_64"
    fail_msg: "The managed oauth2l binary currently supports Linux x86_64 only."
  when: arch_oauth2l_enabled | bool
  tags:
    - packages

- name: Validate Notion CLI platform
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["architecture"] == "x86_64"
    fail_msg: "The managed Notion CLI binary currently supports Linux x86_64 only."
  when: arch_notion_cli_enabled | bool
  tags:
    - packages
    - notion-cli

- name: Create managed package cache directory
  ansible.builtin.file:
    path: /var/cache/arch-ansible
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (arch_oauth2l_enabled | bool) or (arch_notion_cli_enabled | bool)
  tags:
    - packages
    - notion-cli

- name: Download official Notion CLI archive
  ansible.builtin.get_url:
    url: >-
      https://ntn.dev/releases/v{{ arch_notion_cli_version }}/ntn-x86_64-unknown-linux-musl.tar.gz
    dest: >-
      /var/cache/arch-ansible/ntn-{{ arch_notion_cli_version }}-linux-x64.tar.gz
    checksum: "{{ arch_notion_cli_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: arch_notion_cli_enabled | bool
  tags:
    - packages
    - notion-cli

- name: Create versioned Notion CLI directory
  ansible.builtin.file:
    path: "/usr/local/lib/notion-cli/{{ arch_notion_cli_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: arch_notion_cli_enabled | bool
  tags:
    - packages
    - notion-cli

- name: Install official Notion CLI binary
  ansible.builtin.unarchive:
    src: >-
      /var/cache/arch-ansible/ntn-{{ arch_notion_cli_version }}-linux-x64.tar.gz
    dest: "/usr/local/lib/notion-cli/{{ arch_notion_cli_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/usr/local/lib/notion-cli/{{ arch_notion_cli_version }}/ntn"
    owner: root
    group: root
  when: arch_notion_cli_enabled | bool
  tags:
    - packages
    - notion-cli

- name: Link managed Notion CLI binary
  ansible.builtin.file:
    src: "/usr/local/lib/notion-cli/{{ arch_notion_cli_version }}/ntn"
    dest: /usr/local/bin/ntn
    state: link
    owner: root
    group: root
    force: true
  when: arch_notion_cli_enabled | bool
  tags:
    - packages
    - notion-cli

- name: Verify managed Notion CLI binary
  ansible.builtin.command: /usr/local/bin/ntn --version
  changed_when: false
  when: arch_notion_cli_enabled | bool
  tags:
    - packages
    - notion-cli

- name: Download official oauth2l archive
  ansible.builtin.get_url:
    url: >-
      https://storage.googleapis.com/oauth2l/{{ arch_oauth2l_version }}/linux_amd64.tgz
    dest: >-
      /var/cache/arch-ansible/oauth2l-{{ arch_oauth2l_version }}-linux-amd64.tgz
    checksum: "{{ arch_oauth2l_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: arch_oauth2l_enabled | bool
  tags:
    - packages

- name: Create versioned oauth2l directory
  ansible.builtin.file:
    path: "/usr/local/lib/oauth2l/{{ arch_oauth2l_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: arch_oauth2l_enabled | bool
  tags:
    - packages

- name: Install official oauth2l binary
  ansible.builtin.unarchive:
    src: >-
      /var/cache/arch-ansible/oauth2l-{{ arch_oauth2l_version }}-linux-amd64.tgz
    dest: "/usr/local/lib/oauth2l/{{ arch_oauth2l_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/usr/local/lib/oauth2l/{{ arch_oauth2l_version }}/oauth2l"
    owner: root
    group: root
  when: arch_oauth2l_enabled | bool
  tags:
    - packages

- name: Link managed oauth2l binary
  ansible.builtin.file:
    src: "/usr/local/lib/oauth2l/{{ arch_oauth2l_version }}/oauth2l"
    dest: /usr/local/bin/oauth2l
    state: link
    owner: root
    group: root
    force: true
  when: arch_oauth2l_enabled | bool
  tags:
    - packages

- name: Verify managed oauth2l binary
  ansible.builtin.command: /usr/local/bin/oauth2l --help
  changed_when: false
  when: arch_oauth2l_enabled | bool
  tags:
    - packages

- name: Compute declared package set
  ansible.builtin.set_fact:
    packages_declared_all: "{{ (packages_pacman_effective + packages_aur_effective + arch_package_prune_exclude) | unique }}"
  when: arch_package_prune_explicit | bool
  tags:
    - packages

- name: Install yay build prerequisites
  ansible.builtin.package:
    name:
      - base-devel
      - git
    state: present
  when: packages_aur_effective | length > 0
  tags:
    - packages

- name: Check whether yay is installed
  ansible.builtin.stat:
    path: /usr/bin/yay
  register: packages_yay_binary
  when: packages_aur_effective | length > 0
  tags:
    - packages

- name: Check installed AUR package targets
  ansible.builtin.command:
    cmd: "pacman -Q {{ item }}"
  loop: "{{ packages_aur_effective }}"
  register: packages_aur_query
  failed_when: false
  changed_when: false
  check_mode: false
  when: packages_aur_effective | length > 0
  tags:
    - packages

- name: Compute missing AUR packages
  ansible.builtin.set_fact:
    packages_missing_aur: >-
      {{
        packages_aur_query.results
        | rejectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}
  when: packages_aur_effective | length > 0
  tags:
    - packages

- name: Select the Yay bootstrap package
  ansible.builtin.set_fact:
    packages_yay_bootstrap_package: >-
      {{ 'yay-bin' if 'yay-bin' in packages_aur_effective else 'yay' }}
  when: packages_aur_effective | length > 0
  tags:
    - packages

- name: Clone yay build directory
  ansible.builtin.git:
    repo: >-
      https://aur.archlinux.org/{{ packages_yay_bootstrap_package }}.git
    dest: "/tmp/{{ packages_yay_bootstrap_package }}"
    version: master
    force: true
  become: true
  become_user: "{{ arch_primary_user }}"
  when:
    - packages_aur_effective | length > 0
    - not packages_yay_binary.stat.exists
    - packages_missing_aur | length > 0
  tags:
    - packages

- name: Build and install yay
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: "/tmp/{{ packages_yay_bootstrap_package }}"
  become: true
  become_user: "{{ arch_primary_user }}"
  when:
    - packages_aur_effective | length > 0
    - not packages_yay_binary.stat.exists
    - packages_missing_aur | length > 0
  changed_when: true
  tags:
    - packages

- name: Configure no-debug makepkg settings for AUR installs
  ansible.builtin.copy:
    dest: "{{ arch_aur_makepkg_no_debug_conf }}"
    content: |
      # Managed by Ansible. Source system makepkg defaults, but avoid split debug packages.
      source /etc/makepkg.conf

      _ansible_options=()
      for option in "${OPTIONS[@]}"; do
        if [[ "$option" == "debug" || "$option" == "!debug" ]]; then
          continue
        fi
        _ansible_options+=("$option")
      done
      OPTIONS=("${_ansible_options[@]}" "!debug")
      unset _ansible_options option
    owner: root
    group: root
    mode: "0644"
  when:
    - packages_aur_effective | length > 0
    - packages_missing_aur | length > 0
    - arch_aur_makepkg_disable_debug | bool
  tags:
    - packages

- name: Install AUR packages
  ansible.builtin.command:
    cmd: >-
      yay -S --needed --noconfirm
      {{ '--rebuild' if arch_aur_makepkg_disable_debug | bool else '' }}
      {{ ('--makepkgconf ' ~ arch_aur_makepkg_no_debug_conf) if arch_aur_makepkg_disable_debug | bool else '' }}
      {{ packages_missing_aur | join(' ') }}
  become: true
  become_user: "{{ arch_primary_user }}"
  when:
    - packages_aur_effective | length > 0
    - packages_missing_aur | length > 0
  changed_when: true
  tags:
    - packages

- name: Check managed Google Earth Pro executable
  ansible.builtin.stat:
    path: /opt/google/earth/pro/google-earth-pro
    follow: true
  register: packages_google_earth_pro_executable
  when: arch_google_earth_pro_desktop_override_enabled | bool
  tags:
    - packages
    - google-earth-pro

- name: Check managed Google Chrome executable
  ansible.builtin.stat:
    path: /usr/bin/google-chrome-stable
    follow: true
  register: packages_google_chrome_executable
  when: arch_google_earth_pro_desktop_override_enabled | bool
  tags:
    - packages
    - google-earth-pro

- name: Require Google Earth Pro for its desktop override
  ansible.builtin.assert:
    that:
      - packages_google_earth_pro_executable.stat.exists | default(false)
      - packages_google_earth_pro_executable.stat.isreg | default(false)
      - packages_google_earth_pro_executable.stat.executable | default(false)
      - packages_google_chrome_executable.stat.exists | default(false)
      - packages_google_chrome_executable.stat.isreg | default(false)
      - packages_google_chrome_executable.stat.executable | default(false)
    fail_msg: >-
      Google Earth Pro or Google Chrome is not installed. Apply the packages
      tag before the google-earth-pro desktop override tag.
  when: arch_google_earth_pro_desktop_override_enabled | bool
  tags:
    - packages
    - google-earth-pro

- name: Create primary user applications directory
  ansible.builtin.file:
    path: "{{ arch_primary_user_home }}/.local/share/applications"
    state: directory
    owner: "{{ arch_primary_user }}"
    group: "{{ arch_primary_user }}"
    mode: "0755"
  when: arch_google_earth_pro_desktop_override_enabled | bool
  tags:
    - packages
    - google-earth-pro

- name: Install managed Google Earth Pro desktop override
  ansible.builtin.template:
    src: google-earth-pro.desktop.j2
    dest: >-
      {{ arch_primary_user_home }}/.local/share/applications/google-earth-pro.desktop
    owner: "{{ arch_primary_user }}"
    group: "{{ arch_primary_user }}"
    mode: "0644"
  register: packages_google_earth_pro_desktop_override
  when: arch_google_earth_pro_desktop_override_enabled | bool
  tags:
    - packages
    - google-earth-pro

- name: Validate managed Google Earth Pro desktop override
  ansible.builtin.command:
    cmd: >-
      /usr/bin/desktop-file-validate
      {{ arch_primary_user_home }}/.local/share/applications/google-earth-pro.desktop
  changed_when: false
  when: arch_google_earth_pro_desktop_override_enabled | bool
  tags:
    - packages
    - google-earth-pro

- name: Refresh primary user desktop entry cache
  ansible.builtin.command:
    cmd: >-
      /usr/bin/update-desktop-database
      {{ arch_primary_user_home }}/.local/share/applications
  become: true
  become_user: "{{ arch_primary_user }}"
  changed_when: true
  when:
    - arch_google_earth_pro_desktop_override_enabled | bool
    - packages_google_earth_pro_desktop_override.changed
  tags:
    - packages
    - google-earth-pro

- name: Query explicitly installed native packages
  ansible.builtin.command: pacman -Qqen
  register: packages_native_explicit_query
  changed_when: false
  when: arch_package_prune_explicit | bool
  tags:
    - packages

- name: Query explicitly installed foreign packages
  ansible.builtin.command: pacman -Qqem
  register: packages_foreign_explicit_query
  changed_when: false
  failed_when: false
  when: arch_package_prune_explicit | bool
  tags:
    - packages

- name: Compute undeclared explicit native packages
  ansible.builtin.set_fact:
    packages_extra_native: "{{ packages_native_explicit_query.stdout_lines | difference(packages_declared_all) }}"
  when: arch_package_prune_explicit | bool
  tags:
    - packages

- name: Compute undeclared explicit foreign packages
  ansible.builtin.set_fact:
    packages_extra_foreign: "{{ packages_foreign_explicit_query.stdout_lines | default([]) | difference(packages_declared_all) }}"
  when: arch_package_prune_explicit | bool
  tags:
    - packages

- name: Remove undeclared explicit packages
  ansible.builtin.command:
    cmd: "pacman -Rns --noconfirm {{ (packages_extra_native + packages_extra_foreign) | unique | join(' ') }}"
  when:
    - arch_package_prune_explicit | bool
    - (packages_extra_native + packages_extra_foreign) | length > 0
  changed_when: true
  tags:
    - packages
