---
- name: Configure Arch hosts
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Archlinux"
        fail_msg: "This playbook currently targets Arch Linux hosts only."

    - name: Validate display manager selection
      ansible.builtin.assert:
        that:
          - arch_display_manager in ["none", "sddm"]
        fail_msg: "arch_display_manager must be either 'none' or 'sddm'."

  roles:
    - role: base
    - role: packages
    - role: security
    - role: services
    - role: bitmagnet
      when: arch_bitmagnet_enabled | default(false) | bool
      tags:
        - bitmagnet
    - role: desktop
      when: arch_desktop_enabled | bool
    - role: keyring
      when: arch_gnome_keyring_systemd_activation_enabled | bool
      tags:
        - keyring
    - role: sddm
      when: arch_display_manager == "sddm"
      tags:
        - sddm
    - role: boot
      when: arch_boot_enabled | bool
      tags:
        - boot
    - role: pacnew
      when: arch_pacnew_reconciliation_enabled | bool
      tags:
        - pacnew
