LABEL rivest
TEXT HELP
Boot the guided Rivest installer for Framework Laptop 12.
Disk selection and destructive actions still require confirmation in Archinstall.
ENDTEXT
MENU LABEL Rivest Framework 12 guided installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% script=/root/framework-install
