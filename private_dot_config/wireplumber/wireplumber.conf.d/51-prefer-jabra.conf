# Prefer any Jabra ALSA input/output whenever it is available. WirePlumber
# gives a manually remembered default a 30000-point bonus, so this policy must
# rank above that value to remain authoritative after an external route change.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "~Jabra.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 50000
      }
    }
  }
]
